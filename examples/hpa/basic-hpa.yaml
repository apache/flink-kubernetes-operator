apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: basic-hpa-example
spec:
  image: flink:2.2
  flinkVersion: v2_2
  mode: standalone
  flinkConfiguration:
    scheduler-mode: REACTIVE
    taskmanager.numberOfTaskSlots: "2"
  serviceAccount: flink
  jobManager:
    resources:
      requests:
        memory: "2048m"
        cpu: "0.5"
  taskManager:
    replicas: 1
    resources:
      requests:
        memory: "2048m"
        cpu: "0.5"
  job:
    jarURI: local:///opt/flink/examples/streaming/StateMachineExample.jar
    upgradeMode: stateless

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: basic-hpa
  namespace: default
spec:
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageValue: 10Mi
  scaleTargetRef:
    apiVersion: flink.apache.org/v1beta1
    kind: FlinkDeployment
    name: basic-hpa-example
